{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h1>{{ 'แก้ไขอีเวนต์' if is_edit else 'สร้างอีเวนต์ Shooting' }}</h1>
  {% if not is_edit %}<p class="muted" style="margin-top:-.4rem;">ต้องการสร้างหลายรายการพร้อมกัน? <a href="{{ url_for('bulk_create_events') }}">สร้างหลายอีเวนต์ / นำเข้าจากไฟล์</a></p>{% endif %}
  <form method="post" class="form-grid form-wide">
    <label>ชื่องาน<input name="name" value="{{ event.name if event else '' }}" required></label>
    <label>รุ่นแข่งขัน
      <select name="event_group">
        {% set group_options = ['ทั่วไป','อาวุโส','เยาวชน','รุ่นอายุ 12 ปี','รุ่นอายุ 14 ปี','รุ่นอายุ 16 ปี','รุ่นอายุ 18 ปี'] %}
        {% if event and event.event_group not in group_options %}
        <option value="{{ event.event_group }}" selected>{{ event.event_group }}</option>
        {% endif %}
        {% for v in group_options %}
        <option value="{{ v }}" {% if event and event.event_group == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </label>
    <label>ประเภท
      <select name="category">
        {% for v in ['ชาย','หญิง','ผสม'] %}
        <option value="{{ v }}" {% if event and event.category == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </label>
    <label>วันแข่งขัน<input type="date" name="competition_date" value="{{ event.competition_date.isoformat() if event else '' }}" required></label>
    <label>จำนวนสนาม<input type="number" min="1" name="lane_count" value="{{ event.lane_count if event else 4 }}" required {% if event and event.chain_id %}readonly{% endif %}>{% if event and event.chain_id %}<small class="muted">อยู่ในสายคิว “{{ event.chain.name }}” · จำนวนสนามตั้งที่หน้า <a href="{{ url_for('edit_court_chain', chain_id=event.chain_id) }}">ต่อคิวสนาม</a></small>{% endif %}</label>
    <label>จากรอบแรกเข้ารอบถัดไปทันที กี่คน<input id="direct_qualifiers" type="number" min="0" name="direct_qualifiers" value="{{ event.direct_qualifiers if event else 4 }}" required><small class="muted">ระบบใช้ตามรอบถัดไปอัตโนมัติ: รอบ 8 = 4, รอบ 16 = 8</small></label>
    <label>มีรอบ 2 หรือไม่
      <select name="has_round_two">
        <option value="yes" {% if not event or event.has_round_two %}selected{% endif %}>มี</option>
        <option value="no" {% if event and not event.has_round_two %}selected{% endif %}>ไม่มี</option>
      </select>
    </label>
    <label>วิธีคัดผู้มีสิทธิ์ตีรอบ 2
      <select name="round_two_mode" id="round_two_mode">
        <option value="cutoff" {% if not event or (event.round_two_mode or 'cutoff') == 'cutoff' %}selected{% endif %}>ถึงลำดับ (Class) ที่ N</option>
        <option value="next" {% if event and event.round_two_mode == 'next' %}selected{% endif %}>ต่อจากผู้ผ่านตรงอีก N ลำดับ (เท่ากันที่ลำดับสุดท้าย ตี Sudden death)</option>
      </select>
    </label>
    <label>N = <input type="number" min="1" id="round_two_cutoff_rank" name="round_two_cutoff_rank" value="{{ event.round_two_cutoff_rank if event else 16 }}"><small class="muted" id="round_two_hint"></small></label>
    <label>จากรอบ 2 คัดเข้ารอบต่อกี่คน<input id="round_two_advancers" type="number" min="1" name="round_two_advancers" value="{{ event.round_two_advancers if event else 4 }}"><small class="muted">ระบบใช้ตามรอบถัดไปอัตโนมัติ: รอบ 8 = 4, รอบ 16 = 8</small></label>
    <label>รอบถัดไปคือรอบอะไร
      <select name="next_round_label" id="next_round_label">
        {% for v in ['รอบ 16 คน','รอบ 8 คน','รอบ 4 คน','รอบรองชนะเลิศ'] %}
        <option value="{{ v }}" {% if event and event.next_round_label == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </label>
    <label>หน้ารวม: เรียงแถวตามอันดับสด
      <select name="overview_sort_by_rank">
        <option value="yes" {% if not event or event.overview_sort_by_rank is none or event.overview_sort_by_rank %}selected{% endif %}>เปิด — แถวสลับตามคะแนน</option>
        <option value="no" {% if event and event.overview_sort_by_rank == false %}selected{% endif %}>ปิด — คงลำดับการตี</option>
      </select>
      <small class="muted">ปิดเมื่อรายการไม่ต้องการให้แถวสลับไปมา · อันดับ (Class) ยังแสดงตามปกติ</small>
    </label>
    <input type="hidden" name="location" value="{{ event.location if event else '' }}">
    <button class="btn" type="submit">{{ 'บันทึกการแก้ไข' if is_edit else 'สร้างอีเวนต์' }}</button>
  </form>
</section>

<script>
(function(){
  const sel = document.getElementById('next_round_label');
  const direct = document.getElementById('direct_qualifiers');
  const adv = document.getElementById('round_two_advancers');
  function syncQuota(){
    if(!sel || !direct || !adv) return;
    const v = sel.value || '';
    let half = 4;
    if(v.includes('16')) half = 8;
    else if(v.includes('4') || v.includes('รอง')) half = 2;
    direct.value = half;
    adv.value = half;
  }
  if(sel){ sel.addEventListener('change', syncQuota); }
  // คำอธิบายตัวอย่างว่าใครได้ตีรอบ 2
  const mode = document.getElementById('round_two_mode');
  const n = document.getElementById('round_two_cutoff_rank');
  const hint = document.getElementById('round_two_hint');
  function syncHint(){
    if(!mode || !n || !hint) return;
    const d = parseInt(direct.value || '0', 10), k = parseInt(n.value || '0', 10);
    if(!k){ hint.textContent = ''; return; }
    const last = mode.value === 'next' ? d + k : k;
    const count = Math.max(last - d, 0);
    hint.textContent = `ผ่านตรง ${d} คน → Class ${d + 1}–${last} ได้ตีรอบ 2 (${count} คน) · ถ้ามี Class ${last} หลายคน ได้สิทธิ์ทุกคน`;
  }
  [mode, n, direct, sel].forEach(el => el && el.addEventListener('input', syncHint));
  [mode, sel].forEach(el => el && el.addEventListener('change', () => setTimeout(syncHint)));
  syncHint();
})();
</script>
{% endblock %}
